<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Ponte Local — sua IA opera seu PC pelo chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1209"/>
      <stop offset="55%" stop-color="#140e08"/>
      <stop offset="100%" stop-color="#2a1806"/>
    </linearGradient>
    <radialGradient id="brilhoPonte" cx="64%" cy="60%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#140e08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoTexto" cx="16%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffb02e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#140e08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb02e"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffb02e"/>
      <stop offset="100%" stop-color="#f0880c"/>
    </linearGradient>
    <linearGradient id="pilarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241c10"/>
      <stop offset="100%" stop-color="#16100a"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241c10"/>
      <stop offset="100%" stop-color="#140e08"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#504027" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="sombraTitulo" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ===== fundo ===== -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#brilhoPonte)"/>
  <rect width="1200" height="360" fill="url(#brilhoTexto)"/>

  <!-- estrelas -->
  <g fill="#f7f1e5">
    <circle cx="96" cy="52" r="1.2" opacity="0.30"/>
    <circle cx="212" cy="34" r="1" opacity="0.22"/>
    <circle cx="338" cy="66" r="1.4" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.55;0.28" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="38" r="1" opacity="0.20"/>
    <circle cx="586" cy="70" r="1.2" opacity="0.26">
      <animate attributeName="opacity" values="0.30;0.6;0.30" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1092" cy="42" r="1" opacity="0.20"/>
    <circle cx="980" cy="60" r="1.1" opacity="0.24"/>
    <circle cx="860" cy="40" r="1" opacity="0.18"/>
    <circle cx="60" cy="300" r="1" opacity="0.16"/>
    <circle cx="618" cy="318" r="1.2" opacity="0.20"/>
  </g>

  <!-- ===== texto ===== -->
  <text x="70" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="url(#titulo)" filter="url(#sombraTitulo)">PONTE LOCAL</text>
  <rect x="72" y="140" width="330" height="3" rx="1.5" fill="url(#traco)" opacity="0.9"/>
  <text x="72" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#f7f1e5" opacity="0.95">Sua IA opera seu PC pelo chat.</text>
  <text x="72" y="207" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#a89a82">Sem portas abertas &#183; sem VPN &#183; poll s&#243; de sa&#237;da &#183; travas rodando no seu PC</text>

  <text x="72" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8a7d68">O comando cruza a ponte, executa no seu PC e a resposta volta.</text>

  <!-- ===== ilustra&#231;&#227;o: a ponte VM &#8596; PC ===== -->

  <!-- ch&#227;o -->
  <line x1="672" y1="312" x2="1150" y2="312" stroke="#3a3121" stroke-width="1.5"/>
  <ellipse cx="762" cy="312" rx="72" ry="4" fill="#000000" opacity="0.35"/>
  <ellipse cx="1049" cy="312" rx="58" ry="4" fill="#000000" opacity="0.35"/>

  <!-- cabos suspensos -->
  <path d="M712,172 Q902,84 1092,172" fill="none" stroke="#ffb02e" stroke-opacity="0.40" stroke-width="2.5"/>
  <g stroke="#4a3b22" stroke-width="1" opacity="0.75">
    <line x1="769" y1="150" x2="769" y2="226"/>
    <line x1="826" y1="135" x2="826" y2="221"/>
    <line x1="883" y1="129" x2="883" y2="218"/>
    <line x1="921" y1="129" x2="921" y2="218"/>
    <line x1="978" y1="135" x2="978" y2="221"/>
    <line x1="1035" y1="150" x2="1035" y2="226"/>
  </g>

  <!-- pilares -->
  <g>
    <rect x="836" y="168" width="16" height="142" rx="4" fill="url(#pilarGrad)" stroke="#4a3b22"/>
    <rect x="968" y="168" width="16" height="142" rx="4" fill="url(#pilarGrad)" stroke="#4a3b22"/>
    <rect x="831" y="162" width="26" height="8" rx="3" fill="#332814" stroke="#4a3b22"/>
    <rect x="963" y="162" width="26" height="8" rx="3" fill="#332814" stroke="#4a3b22"/>
  </g>

  <!-- deck + lanes -->
  <path d="M700,237 Q902,205 1104,237" fill="none" stroke="#241c10" stroke-width="9" stroke-linecap="round"/>
  <path d="M700,237 Q902,205 1104,237" fill="none" stroke="#55432a" stroke-width="2" stroke-linecap="round"/>
  <path id="laneIda" d="M700,229 Q902,197 1104,229" fill="none" stroke="#ffb02e" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 9"/>
  <path id="laneVolta" d="M700,245 Q902,213 1104,245" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="7 9"/>
  <!-- trajetos de voo dos arquivos, recortados para nascer/morrer atr&#225;s dos aparelhos -->
  <path id="vaiInv" d="M780,219.2 Q914.9,206 1049.8,221.6" fill="none"/>
  <path id="voltaInv" d="M1049.8,237.6 Q914.9,222 780,235.2" fill="none"/>

  <!-- arquivo indo: VM &#8594; seu PC (laranja) -->
  <g>
    <circle r="17" fill="#ffb02e" opacity="0.14">
      <animate attributeName="opacity" values="0.14;0.30;0.14" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M-8,-11 H2 L8,-5 V11 H-8 Z" fill="#ffb02e" stroke="#ffd98a" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M2,-11 V-5 H8" fill="none" stroke="#8a5a10" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="-4.5" y="-1.5" width="9" height="1.7" rx="0.85" fill="#5c3a06" opacity="0.7"/>
    <rect x="-4.5" y="2" width="6.5" height="1.7" rx="0.85" fill="#5c3a06" opacity="0.45"/>
    <animateMotion dur="5.5s" repeatCount="indefinite" begin="-2s" rotate="0">
      <mpath xlink:href="#vaiInv" href="#vaiInv"/>
    </animateMotion>
  </g>

  <!-- arquivo voltando: seu PC &#8594; VM (branco) -->
  <g>
    <circle r="17" fill="#ffffff" opacity="0.10">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M-8,-11 H2 L8,-5 V11 H-8 Z" fill="#f7f1e5" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M2,-11 V-5 H8" fill="none" stroke="#b9ab8d" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="-4.5" y="-1.5" width="9" height="1.7" rx="0.85" fill="#c46a08" opacity="0.8"/>
    <rect x="-4.5" y="2" width="6.5" height="1.7" rx="0.85" fill="#c46a08" opacity="0.5"/>
    <animateMotion dur="5.5s" repeatCount="indefinite" begin="-4.7s" rotate="0">
      <mpath xlink:href="#voltaInv" href="#voltaInv"/>
    </animateMotion>
  </g>

  <!-- cadeado: a trava roda no seu PC -->
  <g>
    <circle cx="902" cy="134" r="20" fill="#ffb02e" opacity="0.10">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M895,128 v-7 a7,7 0 0 1 14,0 v7" fill="none" stroke="#ffb02e" stroke-width="2.5"/>
    <rect x="890" y="127" width="24" height="19" rx="4.5" fill="#140e08" stroke="#ffb02e" stroke-width="2"/>
    <circle cx="902" cy="135" r="2.2" fill="#ffb02e"/>
    <rect x="900.8" y="136" width="2.4" height="5" rx="1.2" fill="#ffb02e"/>
  </g>

  <!-- VM: o relay (rack de servidor) -->
  <g>
    <rect x="724" y="188" width="76" height="108" rx="8" fill="url(#rackGrad)" stroke="#ffb02e" stroke-width="2"/>
    <rect x="734" y="200" width="56" height="24" rx="4" fill="#0f0a06" stroke="#3a3121"/>
    <rect x="740" y="208" width="26" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.55"/>
    <rect x="740" y="214" width="16" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.30"/>
    <circle cx="782" cy="212" r="2.6" fill="#ffb02e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="734" y="232" width="56" height="24" rx="4" fill="#0f0a06" stroke="#3a3121"/>
    <rect x="740" y="240" width="20" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.40"/>
    <rect x="740" y="246" width="12" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.25"/>
    <circle cx="782" cy="244" r="2.6" fill="#ffb02e" opacity="0.85"/>
    <rect x="734" y="264" width="56" height="24" rx="4" fill="#0f0a06" stroke="#3a3121"/>
    <rect x="740" y="272" width="22" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.45"/>
    <rect x="740" y="278" width="9" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.25"/>
    <circle cx="782" cy="276" r="2.6" fill="#ffb02e">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="762" y="309" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#ffcb6b">VM</text>
  </g>

  <!-- SEU PC: monitor com terminal -->
  <g>
    <rect x="1008" y="196" width="82" height="56" rx="7" fill="#140e08" stroke="#f7f1e5" stroke-width="2"/>
    <rect x="1016" y="204" width="66" height="40" rx="4" fill="#0f0a06"/>
    <rect x="1022" y="211" width="22" height="2.5" rx="1.25" fill="#ffb02e" opacity="0.9"/>
    <rect x="1022" y="218" width="34" height="2.5" rx="1.25" fill="#f7f1e5" opacity="0.35"/>
    <text x="1022" y="238" font-family="'Cascadia Code','Consolas',monospace" font-size="11" font-weight="600" fill="#ffb02e">&gt; <tspan><animate attributeName="fill" values="#ffb02e;#0f0a06;#ffb02e" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
    <rect x="1043" y="252" width="12" height="16" fill="#1c1610" stroke="#3a3121"/>
    <rect x="1028" y="268" width="42" height="7" rx="3" fill="#1c1610" stroke="#3a3121"/>
    <text x="1049" y="309" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f7f1e5">SEU PC</text>
  </g>

  <!-- deck de rodap&#233; (identidade) -->
  <rect x="0" y="353" width="1200" height="7" fill="url(#deckGrad)" opacity="0.9"/>
</svg>
