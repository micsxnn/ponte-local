<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Ponte Local — sua IA opera seu PC pelo chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0e1a2b"/>
    </linearGradient>
    <radialGradient id="glowPonte" cx="64%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTexto" cx="18%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="55%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="torreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2330"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pilarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2330"/>
      <stop offset="100%" stop-color="#10161f"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#30363d" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="sombraTitulo" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ===== fundo ===== -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glowPonte)"/>
  <rect width="1200" height="360" fill="url(#glowTexto)"/>

  <!-- estrelas -->
  <g fill="#e6edf3">
    <circle cx="96" cy="52" r="1.2" opacity="0.30"/>
    <circle cx="212" cy="34" r="1" opacity="0.22"/>
    <circle cx="338" cy="66" r="1.4" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.55;0.28" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="38" r="1" opacity="0.20"/>
    <circle cx="590" cy="58" r="1.2" opacity="0.32">
      <animate attributeName="opacity" values="0.32;0.12;0.32" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="648" cy="120" r="1" opacity="0.18"/>
    <circle cx="700" cy="88" r="1.2" opacity="0.26"/>
    <circle cx="1148" cy="70" r="1.3" opacity="0.30">
      <animate attributeName="opacity" values="0.30;0.6;0.30" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1092" cy="42" r="1" opacity="0.20"/>
    <circle cx="980" cy="60" r="1.1" opacity="0.24"/>
    <circle cx="860" cy="40" r="1" opacity="0.18"/>
    <circle cx="60" cy="300" r="1" opacity="0.16"/>
    <circle cx="618" cy="318" r="1.2" opacity="0.20"/>
  </g>

  <!-- ===== texto ===== -->
  <text x="70" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="url(#titulo)" filter="url(#sombraTitulo)">PONTE LOCAL</text>
  <rect x="72" y="140" width="330" height="3" rx="1.5" fill="url(#traco)" opacity="0.9"/>
  <text x="72" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#e6edf3" opacity="0.95">Sua IA opera seu PC pelo chat.</text>
  <text x="72" y="207" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#8b949e">Sem portas abertas &#183; sem VPN &#183; poll s&#243; de sa&#237;da &#183; travas rodando no seu PC</text>

  <!-- pills -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600">
    <rect x="72" y="238" width="112" height="30" rx="15" fill="#1f6feb" fill-opacity="0.14" stroke="#1f6feb" stroke-opacity="0.7"/>
    <text x="128" y="258" text-anchor="middle" fill="#79c0ff">relay 1.3.1</text>
    <rect x="196" y="238" width="102" height="30" rx="15" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff" stroke-opacity="0.7"/>
    <text x="247" y="258" text-anchor="middle" fill="#d2a8ff">skill 3.1.1</text>
    <rect x="310" y="238" width="122" height="30" rx="15" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.7"/>
    <text x="371" y="258" text-anchor="middle" fill="#56d364">agente 1.8.0</text>
    <rect x="444" y="238" width="150" height="30" rx="15" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e" stroke-opacity="0.5"/>
    <text x="519" y="258" text-anchor="middle" fill="#adbac7">0 depend&#234;ncias</text>
  </g>
  <text x="72" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#6e7681">Uma lane por m&#225;quina &#8212; o comando de uma nunca executa na outra.</text>

  <!-- ===== ilustra&#231;&#227;o: a ponte ===== -->

  <!-- chão -->
  <line x1="672" y1="312" x2="1150" y2="312" stroke="#30363d" stroke-width="1.5"/>
  <ellipse cx="762" cy="312" rx="72" ry="4" fill="#000000" opacity="0.35"/>
  <ellipse cx="1046" cy="312" rx="52" ry="4" fill="#000000" opacity="0.35"/>

  <!-- cabos suspensos -->
  <path d="M712,172 Q902,84 1092,172" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2.5"/>
  <g stroke="#30363d" stroke-width="1" opacity="0.65">
    <line x1="769" y1="150" x2="769" y2="226"/>
    <line x1="826" y1="135" x2="826" y2="221"/>
    <line x1="883" y1="129" x2="883" y2="218"/>
    <line x1="921" y1="129" x2="921" y2="218"/>
    <line x1="978" y1="135" x2="978" y2="221"/>
    <line x1="1035" y1="150" x2="1035" y2="226"/>
  </g>

  <!-- pilares -->
  <g>
    <rect x="836" y="168" width="16" height="142" rx="4" fill="url(#pilarGrad)" stroke="#30363d"/>
    <rect x="968" y="168" width="16" height="142" rx="4" fill="url(#pilarGrad)" stroke="#30363d"/>
    <rect x="831" y="162" width="26" height="8" rx="3" fill="#21262d" stroke="#30363d"/>
    <rect x="963" y="162" width="26" height="8" rx="3" fill="#21262d" stroke="#30363d"/>
  </g>

  <!-- deck + lanes -->
  <path id="deckBase" d="M700,237 Q902,205 1104,237" fill="none" stroke="#21262d" stroke-width="9" stroke-linecap="round"/>
  <path d="M700,237 Q902,205 1104,237" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
  <path id="laneA" d="M700,229 Q902,197 1104,229" fill="none" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 9"/>
  <path id="laneB" d="M700,245 Q902,213 1104,245" fill="none" stroke="#bc8cff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 9"/>

  <!-- pacotes da lane netbook (azul) -->
  <g>
    <g>
      <circle r="9" fill="#58a6ff" opacity="0.16"/>
      <circle r="4" fill="#58a6ff"/>
      <animateMotion dur="7.2s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#laneA" href="#laneA"/></animateMotion>
    </g>
    <g>
      <circle r="9" fill="#58a6ff" opacity="0.16"/>
      <circle r="4" fill="#58a6ff"/>
      <animateMotion dur="7.2s" repeatCount="indefinite" begin="-2.4s"><mpath xlink:href="#laneA" href="#laneA"/></animateMotion>
    </g>
    <g>
      <circle r="9" fill="#58a6ff" opacity="0.16"/>
      <circle r="4" fill="#58a6ff"/>
      <animateMotion dur="7.2s" repeatCount="indefinite" begin="-4.8s"><mpath xlink:href="#laneA" href="#laneA"/></animateMotion>
    </g>
  </g>

  <!-- pacotes da lane windows (roxo) -->
  <g>
    <g>
      <circle r="9" fill="#bc8cff" opacity="0.16"/>
      <circle r="4" fill="#bc8cff"/>
      <animateMotion dur="8.6s" repeatCount="indefinite" begin="-1.2s"><mpath xlink:href="#laneB" href="#laneB"/></animateMotion>
    </g>
    <g>
      <circle r="9" fill="#bc8cff" opacity="0.16"/>
      <circle r="4" fill="#bc8cff"/>
      <animateMotion dur="8.6s" repeatCount="indefinite" begin="-4.0s"><mpath xlink:href="#laneB" href="#laneB"/></animateMotion>
    </g>
    <g>
      <circle r="9" fill="#bc8cff" opacity="0.16"/>
      <circle r="4" fill="#bc8cff"/>
      <animateMotion dur="8.6s" repeatCount="indefinite" begin="-6.8s"><mpath xlink:href="#laneB" href="#laneB"/></animateMotion>
    </g>
  </g>

  <!-- cadeado: a trava roda no seu PC -->
  <g>
    <circle cx="902" cy="134" r="20" fill="#3fb950" opacity="0.10">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M895,128 v-7 a7,7 0 0 1 14,0 v7" fill="none" stroke="#3fb950" stroke-width="2.5"/>
    <rect x="890" y="127" width="24" height="19" rx="4.5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <circle cx="902" cy="135" r="2.2" fill="#3fb950"/>
    <rect x="900.8" y="136" width="2.4" height="5" rx="1.2" fill="#3fb950"/>
  </g>

  <!-- netbook -->
  <g>
    <rect x="722" y="220" width="80" height="52" rx="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <rect x="730" y="228" width="64" height="36" rx="4" fill="#58a6ff" fill-opacity="0.10"/>
    <rect x="736" y="236" width="14" height="2.5" rx="1.25" fill="#58a6ff" opacity="0.9"/>
    <rect x="736" y="243" width="22" height="2.5" rx="1.25" fill="#58a6ff" opacity="0.55"/>
    <rect x="736" y="250" width="9" height="7" rx="1.5" fill="#58a6ff" opacity="0.95">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <path d="M714,272 L810,272 L818,283 L706,283 Z" fill="#161b22" stroke="#30363d"/>
    <text x="762" y="303" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#58a6ff">netbook</text>
  </g>

  <!-- windows tower -->
  <g>
    <rect x="1020" y="194" width="54" height="90" rx="8" fill="url(#torreGrad)" stroke="#bc8cff" stroke-width="2"/>
    <rect x="1030" y="208" width="34" height="4" rx="2" fill="#bc8cff" opacity="0.55"/>
    <rect x="1030" y="218" width="34" height="4" rx="2" fill="#bc8cff" opacity="0.35"/>
    <rect x="1030" y="228" width="20" height="4" rx="2" fill="#bc8cff" opacity="0.22"/>
    <circle cx="1031" cy="266" r="3.4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="1044" y="262" width="18" height="8" rx="2" fill="#bc8cff" opacity="0.14"/>
    <text x="1047" y="303" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#d2a8ff">windows</text>
  </g>

  <!-- deck de rodapé (identidade) -->
  <rect x="0" y="353" width="1200" height="7" fill="url(#deckGrad)" opacity="0.9"/>
</svg>
